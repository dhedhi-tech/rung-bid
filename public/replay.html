<!doctype html><meta charset="utf-8"><title>Patta Party · Hand replay</title>
<script>/* Old replay links: the replay now plays on the game screen itself (/?rp=) */
const q = new URLSearchParams(location.search);
location.replace('/?rp=' + encodeURIComponent(q.get('id') || '') + (q.get('me') != null ? '&me=' + encodeURIComponent(q.get('me')) : '') + (q.get('embed') ? '&embed=1' : ''));
</script>
