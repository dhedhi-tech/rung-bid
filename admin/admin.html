<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Game Admin</title>
<style>
:root{--bg:#0d1416;--card:#162125;--line:#24343a;--text:#e9f0ef;--mute:#8ea3a3;--acc:#f5a83a;--good:#4cc38a;--blue:#5aa9e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:15px;color:var(--mute);font-weight:600;margin:26px 0 10px;text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.tile span{color:var(--mute);font-size:13px}
.tile.live b{color:var(--good)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px 8px;display:flex;align-items:flex-end;gap:4px;height:170px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:26px;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.bar i.n{background:var(--blue)}
.bar small{font-size:10px;color:var(--mute);margin-top:4px;white-space:nowrap}.bar em{font-style:normal;font-size:11px;margin-bottom:2px}
.legend{font-size:12px;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600;background:#121b1e}
th:first-child,td:first-child{text-align:left}tr:last-child td{border-bottom:0}
form{max-width:340px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b1113;color:var(--text);font-size:16px;margin:12px 0}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#1b1205;font-weight:700;font-size:15px;cursor:pointer}
.err{color:#ff7b7b;font-size:13px;min-height:18px}.note{background:#2a2412;border:1px solid #5a4a1c;color:#f3d38a;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.stk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;justify-items:center;gap:4px;font-size:12.5px;text-align:center}
.stk img{width:96px;height:96px;object-fit:contain}.stk small{color:var(--mute)}.stk .rm{width:auto;padding:5px 10px;font-size:12px;background:#3a2020;color:#ffb3b3}
.up{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;max-width:420px}
.up input[type=text]{margin:0}#stkPrev img{width:120px;height:120px;object-fit:contain;background:#0f4a44;border-radius:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.top button{width:auto;padding:8px 12px;font-size:13px;background:var(--line);color:var(--text)}
.rep-list{display:grid;gap:10px;margin-bottom:24px}
.rep{border:1px solid #2b444b;border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-size:14px}
.rep-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rep-why{font-weight:800;color:#f4a93a}
.rep-chat{background:rgba(255,255,255,.05);border-radius:8px;padding:6px 8px;font-size:13px;max-height:140px;overflow:auto}
</style></head><body><main id="app"></main><main id="repAdmin" hidden></main><main id="stkAdmin" hidden></main>
<script>
const app = document.getElementById('app');
let key = ''; try { key = sessionStorage.getItem('adminKey') || ''; } catch (e) {}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => Number(v || 0);
const sum = (rows, f) => rows.reduce((a, r) => a + num(r[f]), 0);
const dd = d => { const x = new Date(d + 'T00:00:00'); return x.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };

function login(msg) {
  app.innerHTML = `<form id="f"><h1>Game admin</h1><div class="sub">Enter the admin password you set on Render.</div>
    <input id="p" type="password" autocomplete="current-password" placeholder="Password" required><div class="err">${esc(msg || '')}</div><button>Open</button></form>`;
  document.getElementById('f').onsubmit = e => { e.preventDefault(); key = document.getElementById('p').value; load(); };
}
let timer = null;
async function load() {
  let r, j;
  try { r = await fetch('/admin/data', { headers: { 'x-admin-key': key } }); j = await r.json(); }
  catch (e) { return show(null, 'Could not reach the server. Retrying…'); }
  if (!r.ok) { try { sessionStorage.removeItem('adminKey'); } catch (e) {} clearInterval(timer); timer = null; return login(j.error); }
  try { sessionStorage.setItem('adminKey', key); } catch (e) {}
  show(j);
  if (!timer) timer = setInterval(load, 30000);
}
let last = null;
function show(j, warn) {
  if (!j) { j = last; if (!j) return login(warn); } else last = j;
  const L = j.live, D = j.daily || [], T = D.find(d => String(d.day).slice(0, 10) === j.today) || {};
  const d7 = D.slice(0, 7), d30 = D;
  const chartDays = D.slice(0, 14).reverse();
  const max = Math.max(1, ...chartDays.map(d => num(d.players)));
  const started30 = sum(d30, 'games_started');
  const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '–';
  app.innerHTML = `
  <div class="top"><div><h1>Game admin</h1><div class="sub">Updates every 30 seconds · days in Pakistan time</div></div><button id="out">Lock</button></div>
  ${j.error ? `<div class="note">${esc(j.error)}</div>` : ''}${warn ? `<div class="note">${esc(warn)}</div>` : ''}
  ${j.memory ? `<div class="note">Test mode: stats are not being saved (Supabase is not connected).</div>` : ''}
  <h2>Live now</h2>
  <div class="grid">
    <div class="tile live"><b>${L.online}</b><span>people online</span></div>
    <div class="tile live"><b>${L.playing}</b><span>games in progress</span></div>
    <div class="tile live"><b>${L.people}</b><span>real players in games</span></div>
    <div class="tile"><b>${L.waiting}</b><span>tables waiting to start</span></div>
  </div>
  <h2>Today</h2>
  <div class="grid">
    <div class="tile"><b>${num(T.players)}</b><span>players</span></div>
    <div class="tile"><b>${num(T.new_players)}</b><span>new players</span></div>
    <div class="tile"><b>${num(T.signups)}</b><span>Google sign-ups</span></div>
    <div class="tile"><b>${num(T.games_started)}</b><span>games started</span></div>
    <div class="tile"><b>${num(T.games_finished)}</b><span>games finished</span></div>
  </div>
  <h2>Players per day</h2>
  <div class="chart">${chartDays.length ? chartDays.map(d => { const p = num(d.players), n = num(d.new_players); return `<div class="bar" title="${dd(d.day)}: ${p} players, ${n} new"><em>${p}</em><i class="n" style="height:${100 * n / max}%"></i><i style="height:${100 * (p - n) / max}%;border-radius:0"></i><small>${dd(d.day)}</small></div>`; }).join('') : '<div class="sub">No data yet. Play a game and refresh.</div>'}</div>
  <div class="legend"><i style="background:var(--acc)"></i>returning players<i style="background:var(--blue)"></i>new players</div>
  <h2>Last 7 days</h2>
  <div class="grid">
    <div class="tile"><b>${sum(d7, 'players')}</b><span>player-days</span></div>
    <div class="tile"><b>${sum(d7, 'new_players')}</b><span>new players</span></div>
    <div class="tile"><b>${sum(d7, 'signups')}</b><span>Google sign-ups</span></div>
    <div class="tile"><b>${sum(d7, 'games_started')}</b><span>games started</span></div>
    <div class="tile"><b>${pct(sum(d7, 'games_finished'), sum(d7, 'games_started'))}</b><span>games finished</span></div>
  </div>
  <h2>What people play (last 30 days)</h2>
  <div class="grid">
    <div class="tile"><b>${pct(sum(d30, 'joker_games'), started30)}</b><span>Joker mode</span></div>
    <div class="tile"><b>${pct(sum(d30, 'p4'), started30)}</b><span>4 players</span></div>
    <div class="tile"><b>${pct(sum(d30, 'p6'), started30)}</b><span>6 players</span></div>
    <div class="tile"><b>${pct(sum(d30, 'p8'), started30)}</b><span>8 players</span></div>
    <div class="tile"><b>${pct(sum(d30, 'bot_games'), started30)}</b><span>solo vs bots</span></div>
  </div>
  <h2>Day by day</h2>
  <div class="tw"><table><tr><th>Day</th><th>Players</th><th>New</th><th>Signed in</th><th>Sign-ups</th><th>Games</th><th>Finished</th><th>Hands</th><th>Joker</th></tr>
    ${D.map(d => `<tr><td>${dd(d.day)}</td><td>${num(d.players)}</td><td>${num(d.new_players)}</td><td>${num(d.signed_players)}</td><td>${num(d.signups)}</td><td>${num(d.games_started)}</td><td>${num(d.games_finished)}</td><td>${num(d.hands)}</td><td>${num(d.joker_games)}</td></tr>`).join('') || '<tr><td colspan="9">No data yet</td></tr>'}
  </table></div>
  <h2>Top players (${num(j.accounts)} accounts)</h2>
  <div class="tw"><table><tr><th>Name</th><th>XP</th><th>Games</th><th>Wins</th><th>Coins</th><th>Joined</th></tr>
    ${(j.top || []).map(p => `<tr><td>${esc(p.name)}</td><td>${num(p.xp)}</td><td>${num(p.games)}</td><td>${num(p.wins)}</td><td>${num(p.coins)}</td><td>${p.created_at ? dd(String(p.created_at).slice(0, 10)) : ''}</td></tr>`).join('') || '<tr><td colspan="6">No signed-in players yet</td></tr>'}
  </table></div>
  <h2>Recent sign-ups</h2>
  <div class="tw"><table><tr><th>Name</th><th>Signed up</th><th>Games</th><th>XP</th></tr>
    ${(j.recent || []).map(p => `<tr><td>${esc(p.name)}</td><td>${p.created_at ? esc(new Date(p.created_at).toLocaleString('en-GB', { timeZone: 'Asia/Karachi', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) : ''}</td><td>${num(p.games)}</td><td>${num(p.xp)}</td></tr>`).join('') || '<tr><td colspan="4">No sign-ups yet</td></tr>'}
  </table></div>`;
  document.getElementById('out').onclick = () => { try { sessionStorage.removeItem('adminKey'); } catch (e) {} key = ''; clearInterval(timer); timer = null; document.getElementById('stkAdmin').hidden = true; document.getElementById('repAdmin').hidden = true; stkShown = false; login(); };
  if (!stkShown) { stkShown = true; stickersAdmin(); }
  reportsAdmin();
}
// ---- player reports (Report button on a player's card in the game) ----
async function reportsAdmin() {
  const box = document.getElementById('repAdmin'); box.hidden = false;
  let list = [], err = '';
  try { const r = await fetch('/admin/reports', { headers: { 'x-admin-key': key } }); const j = await r.json(); list = j.list || []; err = j.error || ''; } catch (e) { err = 'Could not load reports'; }
  const when = t => { const d = new Date(t); return d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
  const who = (n, uid) => `<b>${esc(n || '?')}</b>${uid ? ' <small>(account)</small>' : ' <small>(guest)</small>'}`;
  box.innerHTML = `<h2>Player reports (${list.length})</h2>${err ? `<div class="note">${esc(err)}</div>` : ''}
    ${list.length ? `<div class="rep-list">${list.map(r => `<div class="rep">
      <div class="rep-top"><span class="rep-why">${esc(r.reason)}</span><span class="sub">${esc(when(r.at))} · table ${esc(r.table_code || '')}</span></div>
      <div>${who(r.reported_name, r.reported_uid)} reported by ${who(r.reporter_name, r.reporter_uid)}</div>
      ${r.reported_uid ? `<div class="sub">Account id: ${esc(r.reported_uid)}</div>` : ''}
      ${(r.chat || []).length ? `<div class="rep-chat">${r.chat.map(m => `<div>“${esc(m.t)}”</div>`).join('')}</div>` : '<div class="sub">No chat messages from them at that table.</div>'}
    </div>`).join('')}</div>` : '<div class="sub">No reports yet.</div>'}`;
}
// ---- stickers: upload your own, remove ones you added ----
let stkShown = false;
async function stickersAdmin(msg) {
  const box = document.getElementById('stkAdmin'); box.hidden = false;
  let list = [];
  try { const r = await fetch('/admin/stickers', { headers: { 'x-admin-key': key } }); const j = await r.json(); list = j.list || []; } catch (e) {}
  box.innerHTML = `<h2>Stickers (${list.length})</h2>
    <div class="stk-grid">${list.map(st => `<div class="stk"><img src="${esc(st.src)}" alt=""><span>${esc(st.line)}</span>${st.builtin ? '<small>Built in</small>' : `<button class="rm" data-rm="${esc(st.id)}">Remove</button>`}</div>`).join('')}</div>
    <div class="up"><b>Add a sticker</b><span class="sub">PNG, JPG, WebP or SVG. A square picture with a transparent background looks best. It appears for all players within 10 minutes.</span>
      <input type="file" id="stkFile" accept="image/png,image/jpeg,image/webp,image/svg+xml">
      <div id="stkPrev"></div>
      <input type="text" id="stkLine" maxlength="30" placeholder="Sticker line, e.g. Kya baat hai!">
      <button id="stkAdd">Add sticker</button><div class="err" id="stkErr">${esc(msg || '')}</div></div>`;
  let data = '';
  document.getElementById('stkFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; data = '';
    try { data = await prepPic(f); document.getElementById('stkPrev').innerHTML = `<img src="${data}" alt="">`; document.getElementById('stkErr').textContent = ''; }
    catch (err) { document.getElementById('stkErr').textContent = err.message; }
  };
  document.getElementById('stkAdd').onclick = async () => {
    const line = document.getElementById('stkLine').value.trim();
    if (!data) return (document.getElementById('stkErr').textContent = 'Choose a picture first');
    if (!line) return (document.getElementById('stkErr').textContent = 'Type the sticker line');
    const b = document.getElementById('stkAdd'); b.disabled = true; b.textContent = 'Saving…';
    const r = await fetch('/admin/stickers', { method: 'POST', headers: { 'x-admin-key': key, 'Content-Type': 'application/json' }, body: JSON.stringify({ line, data }) });
    const j = await r.json().catch(() => ({}));
    stickersAdmin(r.ok ? 'Added ✔' : j.error || 'Could not save');
  };
  box.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Sure?'; return; }
    const r = await fetch('/admin/stickers/' + encodeURIComponent(b.dataset.rm), { method: 'DELETE', headers: { 'x-admin-key': key } });
    const j = await r.json().catch(() => ({})); stickersAdmin(r.ok ? 'Removed' : j.error);
  });
}
// SVG stays as it is; photos are shrunk to 320 px so they load fast in the game
function prepPic(file) {
  return new Promise((res, rej) => {
    if (file.size > 3 * 1024 * 1024) return rej(new Error('Picture is too big (max 3 MB)'));
    const rd = new FileReader();
    rd.onload = () => {
      if (file.type === 'image/svg+xml') { const d = String(rd.result); return d.length > 400000 ? rej(new Error('SVG is too big (max 300 KB)')) : res(d); }
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 320 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let d = c.toDataURL('image/webp', .9); if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/png');
        res(d);
      };
      img.onerror = () => rej(new Error('Could not read that picture'));
      img.src = rd.result;
    };
    rd.onerror = () => rej(new Error('Could not read that file'));
    rd.readAsDataURL(file);
  });
}
key ? load() : login();
</script></body></html>
